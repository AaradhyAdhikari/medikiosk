<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediKiosk — Patient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<svg class="leafbg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs><pattern id="lf" width="180" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <path d="M90 20 C130 45 130 105 90 130 C50 105 50 45 90 20 Z M90 20 L90 130" fill="none" stroke="#8FD3B8" stroke-width="1.6"/>
    <path d="M90 45 L112 60 M90 45 L68 60 M90 72 L116 88 M90 72 L64 88 M90 99 L108 111 M90 99 L72 111" stroke="#8FD3B8" stroke-width="1.1" fill="none"/>
  </pattern></defs>
  <rect width="100%" height="100%" fill="url(#lf)"/>
</svg>

<main class="stage">
  <div class="kiosk">
    <div class="kbar">
      <span class="pill" id="langpill">हिन्दी</span>
      <span class="spacer"></span>
      <button id="btn-speak" title="Read aloud" aria-label="Read this aloud"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.5 6 8.5H3v7h3l5 4Z"/><path d="M15 9a4.5 4.5 0 0 1 0 6"/><path d="M18 5.8a9 9 0 0 1 0 12.4"/></svg></button>
      <button id="btn-records" title="My records" aria-label="My records" hidden><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5h9l4.5 4.5v12a1 1 0 0 1-1 1h-12.5a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1Z"/><path d="M14 3.5V8h4.5"/><path d="M8.5 12.5h7M8.5 16h4.5"/></svg></button>
      <button id="btn-a11y" title="Larger text and high contrast" aria-label="Accessibility options"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2 21 21M8.5 11h5M11 8.5v5"/></svg></button>
      <button id="btn-lang" title="Change language" aria-label="Change language"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.2 2.4 3.4 5.4 3.4 8.5S14.2 18.1 12 20.5c-2.2-2.4-3.4-5.4-3.4-8.5S9.8 5.9 12 3.5Z"/></svg></button>
      <button id="btn-help" title="Call for help" aria-label="Call for help"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12V5.5a1.6 1.6 0 0 1 3.2 0V11"/><path d="M11.2 10.6V4.6a1.6 1.6 0 0 1 3.2 0V11"/><path d="M14.4 11V6.8a1.6 1.6 0 0 1 3.2 0v7.4c0 3.7-2.4 6.3-5.8 6.3S6 18.4 6 15.2v-2.6a1.6 1.6 0 0 1 2.9-.9"/></svg></button>
      <button id="btn-home" title="Start over" aria-label="Start over"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/><path d="M9.5 21.5v-7h5v7"/></svg></button>
    </div>
    <div class="kbody" id="kbody"></div>
    <div class="kfoot" id="kfoot"></div>
  </div>
</main>
<div class="demo-tag">Prototype · SIH26047 · not a live service</div>

</body>
</html>
